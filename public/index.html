<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Rich Music</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="preload" as="image" href="/logo.png" />
<link rel="stylesheet" href="styles.css" />
<script>
try {
  var t = JSON.parse(localStorage.getItem('smw_theme') || '"dark"');
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
} catch (e) {}
</script>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <img class="splash-logo" src="/logo.png" width="128" height="128" alt="" />
    <div class="splash-name">Rich Music</div>
  </div>
</div>
<!-- Spotify-style icon sprite -->

<div id="app">
  <!-- Sidebar (desktop) -->
  <aside id="sidebar">
    <div class="side-box">
      <div class="logo">
        <img class="logo-img" src="/logo.png" srcset="/logo-64.png 64w, /logo-192.png 192w, /logo.png 512w" sizes="34px" width="34" height="34" alt="Rich Music" />
        <span>Rich Music</span>
      </div>
      <nav id="nav-desktop"></nav>
    </div>
    <div class="side-box q-box">
      <div class="lib-head">
        <button type="button" class="lib-title" id="side-queue-btn" title="Open queue">
          <svg class="ic"><use href="#i-queue"/></svg><span>Queue</span>
        </button>
        <button type="button" id="side-q-clear" class="icon-btn hidden" title="Clear your queue"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div id="side-queue"></div>
    </div>
    <div class="side-box lib-box">
      <div class="lib-head">
        <button class="lib-title" id="lib-title-btn"><svg class="ic"><use href="#i-library"/></svg><span>Your Library</span></button>
        <button id="lib-new" class="icon-btn" title="Your Library"><svg class="ic"><use href="#i-fwd"/></svg></button>
      </div>
      <div id="lib-list"></div>
      <div class="sidebar-footer">Rich Music · free web music player</div>
    </div>
  </aside>

  <!-- Main -->
  <main id="main">
    <div id="topbar">
      <div class="tb-nav">
        <button id="nav-back" class="tb-btn" title="Go back"><svg class="ic"><use href="#i-back"/></svg></button>
        <button id="nav-fwd" class="tb-btn" title="Go forward"><svg class="ic"><use href="#i-fwd"/></svg></button>
      </div>
      <button type="button" id="tb-search" class="tb-search" title="Search">
        <svg class="ic"><use href="#i-search"/></svg>
        <span>What do you want to play?</span>
      </button>
      <div class="tb-actions">
        <button id="theme-toggle" class="tb-btn" title="Toggle theme">
          <svg class="ic" id="theme-ic"><use href="#i-sun"/></svg>
        </button>
      </div>
    </div>
    <div id="view"></div>
  </main>

  <!-- Player bar (Spotify style) -->
  <div id="miniplayer" class="hidden">
    <div class="pb-left">
      <img id="mini-art" alt="" />
      <div class="mini-meta">
        <div id="mini-title">—</div>
        <div id="mini-artist">—</div>
      </div>
      <button id="mini-like" class="icon-btn" title="Favorite"><svg class="ic"><use href="#i-heart-o"/></svg></button>
      <button id="mini-float" class="icon-btn" title="Floating widget"><svg class="ic"><use href="#i-pip"/></svg></button>
      <button id="mini-queue-m" class="icon-btn" title="Queue"><svg class="ic"><use href="#i-queue"/></svg></button>
    </div>
    <div class="pb-center">
      <div class="pb-buttons">
        <button id="mini-shuffle" class="icon-btn sm" title="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button id="mini-prev" class="icon-btn" title="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button id="mini-play" class="play-circle" title="Play/Pause"><svg class="ic"><use href="#i-play"/></svg></button>
        <button id="mini-next" class="icon-btn" title="Next"><svg class="ic"><use href="#i-next"/></svg></button>
        <button id="mini-repeat" class="icon-btn sm" title="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="pb-seek">
        <span id="mini-cur">0:00</span>
        <div class="pb-bar" id="mini-bar"><div id="mini-progress-fill"></div><div class="pb-knob"></div></div>
        <span id="mini-dur">0:00</span>
      </div>
    </div>
    <div class="pb-right">
      <button id="mini-queue" class="icon-btn sm" title="Queue"><svg class="ic"><use href="#i-queue"/></svg></button>
      <button id="mini-open" class="icon-btn sm" title="Now playing"><svg class="ic"><use href="#i-expand"/></svg></button>
      <button type="button" id="mini-mute" class="pb-vol-ic icon-btn sm" title="Mute (M)"><svg class="ic"><use href="#i-volume"/></svg></button>
      <input type="range" id="mini-volume" min="0" max="100" value="100" />
    </div>
  </div>

  <!-- Bottom nav (mobile) -->
  <nav id="nav-mobile"></nav>

  <!-- Now playing (fullscreen) -->
  <div id="nowplaying" class="hidden">
    <div id="np-bg"></div>
    <div class="np-inner">
      <div class="np-handle" aria-hidden="true"></div>
      <div class="np-topbar">
        <button id="np-close" class="icon-btn" title="Minimize"><svg class="ic"><use href="#i-chev-down"/></svg></button>
        <span class="np-caption">Now Playing</span>
        <button id="np-sleep" class="icon-btn" title="Sleep timer"><svg class="ic"><use href="#i-clock"/></svg></button>
      </div>
      <div class="np-tabs">
        <button data-nptab="player" class="np-tab active"><svg class="ic"><use href="#i-note"/></svg>Song</button>
        <button data-nptab="lyrics" class="np-tab"><svg class="ic"><use href="#i-mic"/></svg>Lyrics</button>
        <button data-nptab="queue" class="np-tab"><svg class="ic"><use href="#i-queue"/></svg>Queue</button>
        <button data-nptab="related" class="np-tab"><svg class="ic"><use href="#i-radio"/></svg>Related</button>
      </div>
      <div class="np-body">
        <section id="np-player" class="np-pane active">
          <div class="np-art-wrap"><img id="np-art" alt="" /></div>
          <div class="np-meta">
            <div id="np-title">—</div>
            <div id="np-artist">—</div>
          </div>
          <div class="np-seek">
            <span id="np-cur">0:00</span>
            <input type="range" id="np-range" min="0" max="1000" value="0" />
            <span id="np-dur">0:00</span>
          </div>
          <div class="np-controls">
            <button id="np-shuffle" class="icon-btn" title="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
            <button id="np-prev" class="icon-btn" title="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
            <button id="np-play" class="play-big" title="Play/Pause"><svg class="ic"><use href="#i-play"/></svg></button>
            <button id="np-next" class="icon-btn" title="Next"><svg class="ic"><use href="#i-next"/></svg></button>
            <button id="np-repeat" class="icon-btn" title="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
          </div>
          <div class="np-actions">
            <button id="np-playnext" class="pill-btn hidden" title="Play next"><svg class="ic"><use href="#i-next"/></svg><span>Play next</span></button>
            <button id="np-queueadd" class="pill-btn hidden" title="Add to queue"><svg class="ic"><use href="#i-queue"/></svg><span>Add to queue</span></button>
            <button id="np-like" class="pill-btn"><svg class="ic"><use href="#i-heart-o"/></svg><span>Favorite</span></button>
            <button id="np-addpl" class="pill-btn"><svg class="ic"><use href="#i-plus"/></svg><span>Playlist</span></button>
            <button id="np-more" class="pill-btn" title="More"><svg class="ic"><use href="#i-more"/></svg><span>More</span></button>
            <button id="np-download" class="pill-btn np-extra" title="Download"><svg class="ic"><use href="#i-download"/></svg><span>Download</span></button>
            <button id="np-share" class="pill-btn np-extra" title="Share"><svg class="ic"><use href="#i-share"/></svg><span>Share</span></button>
            <button id="np-speed" class="pill-btn np-extra" title="Playback speed"><svg class="ic"><use href="#i-clock"/></svg><span>1×</span></button>
            <button id="np-float" class="pill-btn np-extra" title="Floating widget"><svg class="ic"><use href="#i-pip"/></svg><span>Widget</span></button>
            <button id="np-quality" class="pill-btn np-extra" title="YouTube Music audio — tap for YouTube max quality"><span>Quality</span></button>
            <button id="np-sb" class="pill-btn np-extra" title="SponsorBlock auto-skip"><svg class="ic"><use href="#i-next"/></svg><span>SB</span></button>
            <div class="np-volume">
              <button type="button" id="np-mute" class="icon-btn sm" title="Mute (M)"><svg class="ic vol-ic"><use href="#i-volume"/></svg></button><input type="range" id="np-volume" min="0" max="100" value="100" />
            </div>
          </div>
          <div id="np-lyric-preview" title="Open lyrics"></div>
        </section>
        <section id="np-lyrics" class="np-pane">
          <button type="button" id="lyrics-karaoke" class="lyrics-karaoke" title="Karaoke mode — bigger lyrics"><svg class="ic"><use href="#i-mic"/></svg></button>
          <div id="lyrics-container"><div class="lyrics-empty">No lyrics yet</div></div>
          <div id="lyrics-source"></div>
        </section>
        <section id="np-queue" class="np-pane"><div id="queue-list"></div></section>
        <section id="np-related" class="np-pane"><div id="related-list" class="loading-note">Loading…</div></section>
      </div>
    </div>
  </div>

  <!-- Add-to-playlist modal -->
  <div id="modal" class="hidden">
    <div class="modal-card">
      <h3 id="modal-title">Add to playlist</h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="pill-btn">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <!-- Floating mini widget (in-page fallback; also cloned into Document PiP) -->
  <div id="float-widget" class="hidden" aria-label="Floating player">
    <img id="fw-art" alt="" />
    <div class="fw-meta">
      <div id="fw-title">—</div>
      <div id="fw-artist">—</div>
      <div id="fw-lyric" title="Open lyrics"></div>
      <div class="fw-bar" id="fw-bar"><div id="fw-fill"></div></div>
    </div>
    <div class="fw-controls">
      <button type="button" class="fw-btn" data-fw="prev" title="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button type="button" class="fw-btn fw-play" data-fw="play" title="Play/Pause"><svg class="ic"><use href="#i-play"/></svg></button>
      <button type="button" class="fw-btn" data-fw="next" title="Next"><svg class="ic"><use href="#i-next"/></svg></button>
      <button type="button" class="fw-btn" data-fw="close" title="Close widget"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </div>

  <!-- hidden YouTube player + canvas/video used for OS Picture-in-Picture (recent apps) -->
  <div id="yt-holder"><div id="yt-player"></div></div>
  <canvas id="pip-canvas" width="360" height="640"></canvas>
  <video id="pip-video" muted playsinline autoplay></video>
</div>
<script src="app.js"></script>
</body>
</html>
